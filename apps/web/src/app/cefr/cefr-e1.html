<section class="e1" aria-labelledby="e1-title">
  <header class="e1__header">
    <p class="e1__brand">Lingua AI</p>
    <h1 id="e1-title" class="e1__title">Общий уровень CEFR</h1>
    <p class="e1__lead">Укажи общий уровень, чтобы начать Ready Tutor. Навыки можно добавить позже.</p>
  </header>

  <form class="e1__form" (submit)="onSubmit($event)">
    <label class="e1__label" for="e1-overall">Overall</label>
    <select
      id="e1-overall"
      class="e1__select"
      name="overall"
      [ngModel]="overall()"
      (ngModelChange)="overall.set($event)"
      [disabled]="saving()"
      required
    >
      <option value="" disabled>Выбери уровень</option>
      @for (level of levels; track level) {
        <option [value]="level">{{ level }}</option>
      }
    </select>

    @if (error(); as err) {
      <p class="e1__error" role="alert">{{ err }}</p>
    }

    <div class="e1__actions">
      <button type="submit" class="e1__save" [disabled]="!overall() || saving()">
        Сохранить
      </button>
      <a routerLink="/" class="e1__back">Назад в чат</a>
    </div>
  </form>
</section>
