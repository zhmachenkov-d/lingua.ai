server {
    # Must stay 4200 — Compose publishes 127.0.0.1:4200:4200 (frozen plan ports).
    # Do not change to :80 without renegotiating host publish mapping.
    listen 4200;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Baseline hardening (repeated wherever add_header is used — nginx does not inherit then).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # Hashed/build assets must 404 when missing (do not fall through to SPA HTML).
    location ~* \.(?:js|css|map|ico|png|svg|woff2?|ttf|eot)$ {
        try_files $uri =404;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store";
    }

    # Same-origin API path for the browser; /api/health → api:8000/health.
    # Runtime name `api` is Compose service DNS.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}

