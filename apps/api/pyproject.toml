[project]
name = "lingua-api"
version = "0.1.0"
description = "Lingua.ai API scaffold (Compose tracer bullet)"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.161.1,<0.162",
  "uvicorn[standard]>=0.34.0",
  "langgraph>=1.2,<1.3",
  "langgraph-checkpoint-postgres>=3.2,<3.3",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
  "sqlalchemy[asyncio]>=2,<3",
  "alembic>=1.13",
  "openai>=1.0,<3",
  "pgvector>=0.4,<0.5",
  "lingua-ids",
]

[tool.uv.sources]
lingua-ids = { path = "../../packages/lingua_ids" }

[project.optional-dependencies]
dev = [
  "httpx>=0.28.0",
  "pytest>=8.0.0",
  "ruff>=0.11.0",
  "mypy>=1.15.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
markers = [
  "integration_db: needs a reachable Postgres via DATABASE_URL (Compose db); skipped locally when missing, fails under CI",
]

[tool.ruff]
target-version = "py313"
src = ["app"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["app"]
ignore_missing_imports = true
