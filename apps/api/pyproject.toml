[project]
name = "lingua-api"
version = "0.1.0"
description = "Lingua.ai API scaffold (Compose tracer bullet)"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.161.1,<0.162",
  "uvicorn[standard]>=0.34.0",
  "langgraph>=1.2,<1.3",
  "langgraph-checkpoint-postgres>=3.2,<3.3",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
  "sqlalchemy>=2,<3",
  "alembic>=1.13",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.0",
  "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
markers = [
  "integration_db: needs a reachable Postgres via DATABASE_URL (Compose db); skipped otherwise",
]
