[project]
name = "lingua-api"
version = "0.1.0"
description = "Lingua.ai API scaffold (Compose tracer bullet)"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.161.1,<0.162",
  "uvicorn[standard]>=0.34.0",
  "langgraph>=1.2,<1.3",
  "langgraph-checkpoint-postgres>=3.2,<3.3",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
  "sqlalchemy[asyncio]>=2,<3",
  "alembic>=1.13",
  "openai>=1.0,<3",
  "pgvector>=0.4,<0.5",
  "lingua-ids",
  "lingua-corpus",
]

[tool.uv.sources]
lingua-ids = { path = "../../packages/lingua_ids" }
lingua-corpus = { path = "../../packages/lingua_corpus" }

[project.optional-dependencies]
dev = [
  "httpx>=0.28.0",
  "hypothesis>=6.100.0",
  "pytest>=8.0.0",
  "ruff>=0.11.0",
  "mypy>=1.15.0",
  "mutmut>=3,<4",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
markers = [
  "integration_db: needs a reachable Postgres via DATABASE_URL (Compose db); skipped locally when missing, fails under CI",
]

[tool.ruff]
target-version = "py313"
src = ["app"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["app"]
ignore_missing_imports = true

[tool.mutmut]
source_paths = ["app"]
only_mutate = [
  "app/llm/*.py",
  "app/router/*.py",
  "app/review/*.py",
  "app/tutor/*.py",
  "app/corpus/*.py",
]
do_not_mutate = [
  "app/*/__init__.py",
  "app/__init__.py",
]
also_copy = [
  "contracts",
]
pytest_add_cli_args_test_selection = [
  "-m", "not integration_db",
  "--ignore=tests/test_max_turn_length_contract.py",
  "--ignore=tests/test_chat_turn_idle_budget.py",
  "--ignore=tests/test_cta_id_contract.py",
  "--ignore=tests/test_corpus_schema.py",
  "--ignore=tests/test_ws_close_code_contract.py",
  "--ignore=tests/test_compose_api_start_period.py",
  "--ignore=tests/test_ws_occupancy_single_worker_gate.py",
  "--ignore=tests/test_compose_web_depends_on.py",
  "--ignore=tests/test_ci_api_unit_job.py",
  "--deselect=tests/test_memory_plane.py::test_session_non_sot_wording_in_model_and_readme",
]
pytest_add_cli_args = ["-q", "--tb=no"]
mutate_only_covered_lines = true
use_git_change_detection = false
