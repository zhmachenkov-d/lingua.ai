[project]
name = "lingua-ingest"
version = "0.1.0"
description = "Lingua.ai corpus ingest job (Marker Compose CPU spike)"
requires-python = ">=3.13"
dependencies = [
  "marker-pdf==2.0.0",
  "pymupdf>=1.26,<2",
  "psutil>=7.0,<8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.11.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["ingest*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
src = ["ingest", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
