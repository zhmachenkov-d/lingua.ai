[project]
name = "lingua-ingest"
version = "0.1.0"
description = "Lingua.ai corpus ingest job (ocrmypdf CPU OCR + optional Marker)"
requires-python = ">=3.13"
dependencies = [
  "marker-pdf==2.0.0",
  "pymupdf==1.28.2",
  "psutil==7.2.2",
  # Direct so tool.uv.sources can pin the CPU wheel index (Compose spike).
  "torch",
  "torchvision",
  "lingua-ids",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.11.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# Keep transitive torch/torchvision on the CPU wheel index (Compose spike).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
lingua-ids = { path = "../../packages/lingua_ids" }
