# Dev / nested-Docker Compose stack (host network).
# Use when Compose embedded DNS (127.0.0.11) cannot resolve service names:
#   docker compose -f compose.dev.yaml up --build
#
# Binds 127.0.0.1 only (4200/8000/5432). No `ports:` (incompatible with host
# network). Default bridge topology stays in compose.yaml.

services:
  db:
    image: pgvector/pgvector:pg16
    network_mode: host
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    command: ["postgres", "-c", "listen_addresses=127.0.0.1"]
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      network: host
    network_mode: host
    environment:
      # Build DATABASE_URL in-process (percent-encodes password); do not interpolate raw secrets into the URL here.
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_HOST: 127.0.0.1
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    command:
      ["uvicorn", "app.main:app", "--host", "127.0.0.1", "--port", "8000"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      # ≥ LOCK_TIMEOUT_SECONDS (60) + 2×WORK_TIMEOUT_SECONDS (120×2) + 60s margin
      start_period: 360s
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      network: host
    network_mode: host
    volumes:
      - ./apps/web/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test:
        ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:4200/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    depends_on:
      api:
        condition: service_healthy

  # HMR / live reload — do not run with `web` (same host port 4200).
  # Usage: docker compose -f compose.dev.yaml stop web && \
  #        docker compose -f compose.dev.yaml --profile web-dev up web-dev
  web-dev:
    profiles: [web-dev]
    image: node:22-bookworm
    network_mode: host
    working_dir: /app
    volumes:
      - ./apps/web:/app
      - web_dev_node_modules:/app/node_modules
    command: ["sh", "-c", "npm ci && npx ng serve --host 127.0.0.1 --port 4200"]

  ingest:
    profiles: [ingest]
    build:
      context: .
      dockerfile: apps/ingest/Dockerfile
      network: host
    network_mode: host
    environment:
      TEXTBOOKS_DIR: /textbooks
      # Tracer co-ingests SB then WB; both PDFs must be present under textbooks/.
      INGEST_MODE: tracer
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_HOST: 127.0.0.1
      PARSE_PRIMARY: ocrmypdf
      OCRMYPDF_JOBS: "4"
      OCR_CACHE_DIR: /tmp/lingua-ocr-cache
      HF_HOME: /models/hf
      TRANSFORMERS_CACHE: /models/hf
      TORCH_DEVICE: cpu
      LLAMA_CPP_BINARY: /usr/local/bin/llama-server
      SURYA_INFERENCE_BACKEND: llamacpp
      SURYA_INFERENCE_PARALLEL: "1"
      LLAMA_CPP_EXTRA_ARGS: "--threads 8"
    volumes:
      - ./textbooks:/textbooks:ro
      - ingest_hf_cache:/models/hf
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "main.py"]

volumes:
  db_data:
  web_dev_node_modules:
  ingest_hf_cache:
