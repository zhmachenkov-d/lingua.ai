[project]
name = "lingua-corpus"
version = "0.1.0"
description = "Shared SQLAlchemy ORM for corpus tables (textbook, textbook_unit, chunk, embedding)"
requires-python = ">=3.13"
dependencies = [
  "lingua-ids",
  "sqlalchemy>=2,<3",
  "pgvector>=0.4,<0.5",
]

[tool.uv.sources]
lingua-ids = { path = "../lingua_ids" }

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["lingua_corpus*"]

[tool.setuptools.package-data]
lingua_corpus = ["py.typed"]
