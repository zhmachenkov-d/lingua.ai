# Compose loads project `.env` for ${VAR} substitution only.
# Do not use env_file on services — that would inject every key into containers.
#
# Static IPv4 + extra_hosts: nested Docker with iptables disabled often breaks
# embedded DNS (127.0.0.11). Service names still work via /etc/hosts.
networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/16

services:
  db:
    image: pgvector/pgvector:pg16
    networks:
      default:
        ipv4_address: 172.28.0.2
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
      # host network: nested Docker often lacks iptables/NAT DNS for bridge builds
      network: host
    networks:
      default:
        ipv4_address: 172.28.0.3
    extra_hosts:
      - "db:172.28.0.2"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:?POSTGRES_DB is required}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      network: host
    networks:
      default:
        ipv4_address: 172.28.0.4
    extra_hosts:
      - "api:172.28.0.3"
    ports:
      - "127.0.0.1:4200:4200"
    healthcheck:
      test:
        ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:4200/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    depends_on:
      - api

  # HMR / live reload — do not run with `web` (same host port 4200).
  # Usage: docker compose stop web && docker compose --profile web-dev up web-dev
  web-dev:
    profiles: [web-dev]
    image: node:22-bookworm
    working_dir: /app
    volumes:
      - ./apps/web:/app
      - web_dev_node_modules:/app/node_modules
    command: ["sh", "-c", "npm ci && npx ng serve --host 0.0.0.0 --port 4200"]
    ports:
      - "127.0.0.1:4200:4200"

  ingest:
    profiles: [ingest]
    build:
      context: ./apps/ingest
      network: host

volumes:
  db_data:
  web_dev_node_modules:
