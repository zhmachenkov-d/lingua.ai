# Compose loads project `.env` for ${VAR} substitution only.
# Do not use env_file on services — that would inject every key into containers.

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      # host network: nested Docker often lacks iptables/NAT DNS for bridge builds
      network: host
    environment:
      # Build DATABASE_URL in-process (percent-encodes password); do not interpolate raw secrets into the URL here.
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_HOST: db
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      # ≥ LOCK_TIMEOUT_SECONDS (60) + 2×WORK_TIMEOUT_SECONDS (120×2) + 60s margin
      start_period: 360s
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      network: host
    ports:
      - "127.0.0.1:4200:4200"
    healthcheck:
      test:
        ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:4200/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    depends_on:
      api:
        condition: service_healthy

  # HMR / live reload — do not run with `web` (same host port 4200).
  # Host networking so apps/web/proxy.conf.json can reach api at 127.0.0.1:8000
  # (bridge loopback would miss the published api port). Same pattern as compose.dev.yaml.
  # Usage: docker compose stop web && docker compose --profile web-dev up web-dev
  web-dev:
    profiles: [web-dev]
    image: node:22-bookworm
    network_mode: host
    working_dir: /app
    volumes:
      - ./apps/web:/app
      - web_dev_node_modules:/app/node_modules
    command: ["sh", "-c", "npm ci && npx ng serve --host 127.0.0.1 --port 4200"]

  ingest:
    profiles: [ingest]
    build:
      context: .
      dockerfile: apps/ingest/Dockerfile
      network: host
    environment:
      TEXTBOOKS_DIR: /textbooks
      # Tracer co-ingests SB then WB; both PDFs must be present under textbooks/.
      INGEST_MODE: tracer
      # Optional: INGEST_READY_SWEEP=full walks all ef4-beg-sb map units (default first).
      INGEST_READY_SWEEP: ${INGEST_READY_SWEEP:-first}
      # Same component env → in-process URL pattern as api (AD-5).
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_HOST: db
      # Default CPU parse: ocrmypdf/Tesseract (Marker CPU fast is Q1 no-go).
      PARSE_PRIMARY: ocrmypdf
      OCRMYPDF_JOBS: "4"
      OCR_CACHE_DIR: /tmp/lingua-ocr-cache
      # BGE-M3 / FlagEmbedding cache — mount ingest_hf_cache to avoid re-download.
      HF_HOME: /models/hf
      TRANSFORMERS_CACHE: /models/hf
      # Optional Marker path: PARSE_PRIMARY=marker plus the knobs below.
      TORCH_DEVICE: cpu
      LLAMA_CPP_BINARY: /usr/local/bin/llama-server
      SURYA_INFERENCE_BACKEND: llamacpp
      SURYA_INFERENCE_PARALLEL: "1"
      LLAMA_CPP_EXTRA_ARGS: "--threads 8"
    volumes:
      - ./textbooks:/textbooks:ro
      - ingest_hf_cache:/models/hf
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "main.py"]

volumes:
  db_data:
  web_dev_node_modules:
  ingest_hf_cache:
